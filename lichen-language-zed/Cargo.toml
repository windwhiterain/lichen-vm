[package]
name = "lichen-language-zed"
version = "0.1.0"
edition = "2024"
description = "A Zed editor extension for Lichen (syntax support + LSP integration)."

[lib]
crate-type = ["lib", "cdylib"]

[features]
# `zed` is on by default so that a plain `cargo build` (including the one Zed's
# own dev-extension builder runs, which does NOT pass `--features zed`) compiles
# the extension body and emits the required `zed:api-version` custom section.
# Without it, Zed reports "no zed:api-version section".
default = ["zed"]
# Turns this crate into an actual Zed WASM plugin (adds `zed_extension_api`).
# Build it with:
#   rustup target add wasm32-wasip2
#   cargo build -p lichen-language-zed --target wasm32-wasip2
# then install the built `target/wasm32-wasip2/release/lichen_language_zed.wasm`
# as a dev extension (Zed reads `extension.toml` in this directory).
zed = ["dep:zed_extension_api"]

[dependencies]
# The shared-frontend crates (`lichen-language`, `lichen-language-server`) were
# removed: the extension does not call into them yet. Re-add them as path deps the
# moment it uses `lichen-language-server`'s editor-view library (span math / name
# resolution) — keep `default-features = false` so the tower-lsp/tokio stack stays
# out of the WASM build.
zed_extension_api = { version = "0.7.0", optional = true }

[dev-dependencies]
# For `tests/grammar_consistency.rs`: build the grammar and validate every `.scm`
# query against it, and check the pinned grammar `rev` hasn't gone stale. These
# are host-only (dev-deps never enter the WASM build).
tree-sitter = "0.25"
tree-sitter-lichen = { path = "../tree-sitter-lichen" }
