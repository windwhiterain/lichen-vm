# Zed extension manifest for the Lichen language and its language server.
#
# Install as a dev extension:  Zed → Extensions → "Install Dev Extension",
# then select THIS directory (`lichen-language-zed/`). Zed builds the
# extension WASM from the `Cargo.toml` in this directory (see the `zed` feature).
#
# For the official registry, this whole `lichen-vm` repository would be added as
# a public submodule of `zed-industries/extensions` with `path = "lichen-language-zed"`
# (so the `../crates/lichen-language*` path dependencies resolve during the build).

id = "lichen"
name = "Lichen"
version = "0.1.0"
schema_version = 1
authors = ["Lichen Developers"]
description = "Lichen language support and language server for Zed."
repository = "https://github.com/windwhiterain/lichen-vm"

# Capabilities the extension asks Zed to grant. The extension runs the `lichen`
# package manager (`lichen path language-server [--project <root>]`) to resolve
# (and, if absent, install) the language server into Lichen Home; on a fresh
# machine with neither `lichen` on `$PATH` nor a copy in `$LICHEN_HOME/tools`,
# it downloads the prebuilt `lichen` binary from this repo's GitHub release via
# `curl`, so the toolchain bootstraps itself.
#
# `command = "*"` for the package manager is required because it is located at a
# per-user path (`$LICHEN_HOME/tools/lichen`, or wherever `which` finds it) that
# cannot be known statically; its args are locked to the `path language-server`
# subcommand. The `curl` capability is the minimal download path (mirroring the
# package manager's own `toolchain::download`). `process:exec` is what Zed gates
# for `Command::output()` (see Zed's extension capabilities).
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["path", "language-server", "**"]

[[capabilities]]
kind = "process:exec"
command = "curl"
args = ["**"]

# The language server Zed should launch for Lichen buffers. It is *not* bundled
# with the extension (per Zed's publishing rules); the extension's
# `language_server_command` supplies the command.
#
# On first launch, if the server is not already on `$PATH`, the extension reports
# install progress to Zed and asks the `lichen` package manager to ensure it is
# present: `lichen path language-server` installs the *prebuilt* compiler + language
# server into Lichen Home (`$LICHEN_HOME`, default `~/.lichen`) at the package
# manager's own commit and prints the binary path. `lichen` is found on `$PATH` or
# at `$LICHEN_HOME/tools/lichen`; how it was installed does not matter. Run `lichen
# update` to move the package manager (and the toolchain it installs) to a later
# commit.
#
# The extension passes the worktree root as `--project <root>` so that a project
# importing a *native plugin* composes its own language server over that plugin
# set (`lichen path language-server --project <root>` builds/caches the composed
# server into the plugin-set LSP slot, understanding the plugin's leaves for
# diagnostics / hover / go-to-definition). A project without native plugins uses
# the shipping server.
[language_servers.lichen-language-server]
name = "Lichen Language Server"
languages = ["Lichen"]

# Map Zed's "Lichen" language to the LSP `languageId` our server receives in
# `textDocument/didOpen`.
[language_servers.lichen-language-server.language_ids]
"Lichen" = "lichen"

# Tree-sitter grammar for syntax highlighting, living in THIS repository as the
# `tree-sitter-lichen/` sub-directory.  The optional `path` field (seen here) is
# what lets Zed build a grammar from a sub-directory of a (mono)repo; it is
# interpreted relative to the root of the grammar repository.
#
# `rev` must be a real Git SHA in `lichen-vm` — set it to the commit that
# contains the `tree-sitter-lichen/` directory, then `tree-sitter generate` was
# already run so `src/parser.c` is committed.  `0773b18` is the grammar update
# that added the `return` keyword (and regenerated `src/parser.c`); the earlier
# `9b23892` rev predates `return`, which made the extension's `highlights.scm`
# fail on load with `Query error ... Invalid node type "return"`.
#
# The `repository` is the public HTTPS remote and `rev` is a commit pushed to
# `origin/v1`, so a registry install (or any machine without a local clone) can
# clone the repo and check out `rev`. For local development only, you may
# temporarily point `repository` at your local checkout (`file:///…`) and keep the
# same `rev`.
[grammars.lichen]
repository = "https://github.com/windwhiterain/lichen-vm"
rev = "d799ade783ca7a0424dd1ab26dda2fd680d0a11c"
path = "tree-sitter-lichen"
