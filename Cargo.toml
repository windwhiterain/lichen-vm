[workspace]
resolver = "3"
members = [
    "crates/lichen-span",
    "crates/lichen-utils",
    "crates/lichen-registry",
    "crates/lichen-language-lex",
    "crates/lichen-language-parser",
    "crates/lichen-preprocess",
    "crates/lichen-lowlevel",
    "crates/lichen-highlevel",
    "crates/lichen-compute",
    "crates/lichen-render",
    "crates/lichen-doc",
    "crates/lichen-perspective",
    "crates/lichen-language",
    "crates/lichen-tools",
    "crates/lichen-compiler",
    "crates/lichen-language-server",
    "lichen-language-zed",
    "crates/lichen-package",
    "lichen-std-native",
]
# `tree-sitter-lichen` is deliberately NOT a workspace member: it is a standalone
# dev tool for the grammar. Zed builds the grammar itself from `grammar.js`, and
# the only other consumer (the grammar consistency test) is opt-in, so the default
# `cargo test --workspace` / WASM build never builds it and never needs the
# tree-sitter CLI. It is pulled in on demand as an optional dep when the
# `grammar-consistency` feature is enabled, or tested directly via its manifest:
#   cargo test --manifest-path tree-sitter-lichen/Cargo.toml
exclude = ["tree-sitter-lichen"]

# `lichen-std-native` declares its core deps as **git** deps (to this same
# repo) so an external compose crate (a generated plugin-built compiler) can
# depend on it via git and resolve the whole core subtree from git — a path dep
# into *this* workspace is what cargo cannot fresh-resolve for such a crate.
# The crate stays a workspace member: this patch redirects those git deps back
# to the local path members for the monorepo's own build, so the workspace
# compiles cross-typed (a git `lichen-highlevel` and the local member would be
# distinct crate instances and the plugin's trait impls would not unify).
[patch."https://github.com/windwhiterain/lichen-vm"]
lichen-utils = { path = "crates/lichen-utils" }
lichen-lowlevel = { path = "crates/lichen-lowlevel" }
lichen-highlevel = { path = "crates/lichen-highlevel" }
