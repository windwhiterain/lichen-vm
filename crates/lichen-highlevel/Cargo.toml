[package]
name = "lichen-highlevel"
version.workspace = true
edition.workspace = true

# This crate carries no inline test, so cargo builds no lib test binary for it: an
# empty harness costs a link and a process start, and an inline `#[test]` added
# here would never run.
[lib]
test = false

[dependencies]
slotmap.workspace = true
stacksafe.workspace = true
lichen-utils.workspace = true
lichen-lowlevel.workspace = true
# The mark and claim vocabulary the IR-time assembly shares with the kernel
# artifact: `lichen-kernel-ir` is a dependency-free leaf, so this costs no layer.
lichen-kernel-ir.workspace = true

[dev-dependencies]
# The one test harness: a named IR writer and an inspection surface over the
# built module. A dev-dependency, so no library half of the workspace links it.
lichen-testkit.workspace = true
