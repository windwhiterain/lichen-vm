[package]
name = "lichen-language-server"
version = "0.1.0"
edition = "2024"
default-run = "lichen-language-server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lichen-language = { path = "../lichen-language" }
lichen-highlevel = { path = "../lichen-highlevel" }

[[bin]]
name = "lichen-language-server"
path = "src/bin/lichen-language-server.rs"
