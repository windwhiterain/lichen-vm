[package]
name = "lichen-serve"
version.workspace = true
edition.workspace = true
description = "A session that owns a compute backend and reports what one run asked the device for."

# This crate carries no inline test, so cargo builds no lib test binary for it: an
# empty harness costs a link and a process start, and an inline `#[test]` added
# here would never run.
[lib]
test = false

[dependencies]
axum = "0.8"
fancy-regex = "0.14"
futures-util = "0.3"
lichen-compute.workspace = true
lichen-compute-gpu.workspace = true
lichen-graph-ir.workspace = true
lichen-kernel-ir.workspace = true
lichen-language.workspace = true
lichen-utils.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
tokio-stream = "0.1"
unicode-normalization = "0.1"
