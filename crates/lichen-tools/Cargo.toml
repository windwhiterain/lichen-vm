[package]
name = "lichen-tools"
version.workspace = true
edition.workspace = true
description = "Repository tooling for the lichen tree — the README example sync, split out of the compiler library so no embedder links it."

[lib]
name = "lichen_tools"
path = "src/lib.rs"

[[bin]]
name = "sync-readme"
path = "src/bin/sync-readme.rs"

[dependencies]
# The README examples are compute programs, so the generator drives the compute
# sub-language rather than the bare language the composer alone composes.
lichen-compute.workspace = true
lichen-language.workspace = true
# The device backend, optional: the example that dispatches each example program to a
# device needs it and nothing in the library does.
lichen-compute-gpu = { workspace = true, optional = true }

[features]
device = ["lichen-compute-gpu"]

[[example]]
name = "operators_on_device"
required-features = ["device"]
