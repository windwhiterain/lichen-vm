[package]
name = "lichen-language"
version.workspace = true
edition.workspace = true

# This crate composes no native plugin: a vocabulary is named by the host that
# drives it, and the compute plugin names its own in `lichen-compute/src/language.rs`.
[dependencies]
stacksafe.workspace = true
lichen-doc.workspace = true
lichen-highlevel.workspace = true
lichen-language-lex.workspace = true
lichen-language-parser.workspace = true
lichen-perspective.workspace = true
lichen-lowlevel.workspace = true
lichen-preprocess.workspace = true
lichen-registry.workspace = true
lichen-render.workspace = true
lichen-utils.workspace = true
libloading = "0.8"

# Only `tests/persist.rs` uses the package manager: the compiler-slot contract
# test compares the slot this crate reads with the one the package manager
# installs into. The native standard library is the one the tests load beside
# it. Both are normal dependencies because this workspace declares no
# dev-dependencies, and both cost nothing to link: the preprocess, registry and
# highlevel above already carry them.
lichen-package.workspace = true
lichen-std-native.workspace = true
