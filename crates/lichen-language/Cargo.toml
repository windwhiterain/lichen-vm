[package]
name = "lichen-language"
version.workspace = true
edition.workspace = true

[dependencies]
stacksafe.workspace = true
lichen-compute.workspace = true
lichen-doc.workspace = true
lichen-highlevel.workspace = true
lichen-language-lex.workspace = true
lichen-language-parser.workspace = true
lichen-perspective.workspace = true
lichen-lowlevel.workspace = true
lichen-preprocess.workspace = true
lichen-registry.workspace = true
lichen-render.workspace = true
lichen-utils.workspace = true

[dev-dependencies]
# The seam test: a real lichen program dispatching to a real device.  This is a
# **dev**-dependency on purpose and not a cycle — `lichen-compute` does not depend
# on `lichen-compute-gpu` and the GPU crate does not depend on `lichen-compute`,
# so the two can be brought together in a test without this crate's library half
# ever linking a GPU loader.
lichen-compute-gpu.workspace = true
# Only `tests/persist.rs` uses this: the compiler-slot contract test compares
# the slot this crate reads with the one the package manager installs into.
lichen-package.workspace = true
lichen-std-native.workspace = true
# `tests/readme.rs` and `tests/examples.rs` drive the README tooling, which
# moved to its own crate (`P2-6`); a dev-dependency keeps them here without
# putting the generator back in the library.
lichen-tools.workspace = true
