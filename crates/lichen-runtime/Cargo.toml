[package]
name = "lichen-runtime"
version.workspace = true
edition.workspace = true

# **No language dependency, and that is an invariant rather than an accident of the
# current tree.**  The seam is checkable in review: anything that takes a `Module`
# belongs to the language-integration side (`lichen-compute`), anything that takes
# only IR types — a `KernelFragment`, an `Artifact`, a `KernelId` — belongs here.
# `Module` is `lichen-lowlevel`'s, so naming none of `lichen-lowlevel`,
# `lichen-highlevel`, `lichen-language`, `lichen-language-parser` or
# `lichen-preprocess` *is* the check: `cargo tree -p lichen-runtime` must show none
# of them.  Without that, anything that wants to run an artifact has to drag the
# language in, and a runtime that cannot exist without a language is a sub-language
# with a smaller name.
[dependencies]
# The artifact is `lichen-kernel-ir`'s vocabulary, so this is the same argument
# `lichen-kernel-ir` states: a dependency named here is one every backend that reads
# an artifact cannot avoid.
lichen-kernel-ir.workspace = true
# The recording a pass rewrites: `Graph` and its nodes. It depends on
# `lichen-kernel-ir` alone, so naming it adds nothing to the backend contract.
lichen-graph-ir.workspace = true
# The symbolic core and the bridge that reads a marked role out of a fragment: a
# region's schema is an expression tree, so deriving one is library work and not a
# backend's. `lichen-fusion` has no dependencies of its own and the bridge names only
# it and `lichen-kernel-ir`, so a backend that reads a claim inherits no runtime.
lichen-fusion.workspace = true
lichen-fusion-bridge.workspace = true
# The hashes a region and a pack are named by, taken over canonical text.
lichen-utils.workspace = true
# The fused kernel is text a human edits, so the schema derives `Facet` and the text
# is JSON rather than a hand-written codec.
facet.workspace = true
# The reader, which refuses a hand-edited text with the field and the byte offset it
# failed at rather than a message saying only that it failed.
facet-json.workspace = true
# The engine one backend caches its compiled modules in. It is a runtime, not a
# language: `wasmi::Module` is a compiled wasm module and not `lichen_lowlevel::Module`.
# Optional, and behind the `wasm` feature: an engine exists here only to hold a compiled
# module, so a backend that runs no wasm takes this crate with `default-features = false`
# and never resolves it.
wasmi = { workspace = true, optional = true }
# The assembler the engine runs: a fragment set lowered onto a wasm module. The
# encoder and the module builder are the assembler's, and they are behind the
# same feature as the engine, so a backend that runs no wasm resolves none of
# them.
#
# The wasm-tools release of `wasmi` 2.0.0's validator (`wasmparser` 0.228):
# `wasmi::Module::new` validates every assembled module before it runs, so the
# encoder must not be a newer generation than the parser that checks its output.
wasm-encoder = { version = "0.248.0", optional = true }
waffle = { version = "0.3.2", default-features = false, optional = true }

# The wasm half is the emitted-module cache and the engine it holds. It is on by
# default, so every in-tree consumer keeps its wasm path unchanged and only a backend
# that reads no cache opts out.
[features]
default = ["wasm"]
wasm = ["dep:wasmi", "dep:wasm-encoder", "dep:waffle"]