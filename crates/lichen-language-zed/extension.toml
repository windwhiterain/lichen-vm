# Zed extension manifest for the Lichen language and its language server.
#
# Install as a dev extension:  Zed → Extensions → "Install Dev Extension",
# then select THIS directory (`crates/lichen-language-zed/`). Zed builds the
# extension WASM from the `Cargo.toml` in this directory (see the `zed` feature).
#
# For the official registry, this whole `lichen-vm` repository would be added as
# a public submodule of `zed-industries/extensions` with `path = "crates/lichen-language-zed"`
# (so the `../lichen-language*` path dependencies resolve during the build).

id = "lichen"
name = "Lichen"
version = "0.1.0"
schema_version = 1
authors = ["Lichen Developers"]
description = "Lichen language support and language server for Zed."
repository = "https://github.com/windwhiterain/lichen-vm"

# The language server Zed should launch for Lichen buffers. It is *not* bundled
# with the extension (per Zed's publishing rules); the extension's
# `language_server_command` supplies the command, and the `lichen-language-server`
# binary must be on the user's `$PATH` (locating/downloading it is a follow-up).
# Install it from the lichen-vm checkout (this puts it on `~/.cargo/bin`, which is
# on a stock Cargo `$PATH`):
#
#     cargo install --path crates/lichen-language-server
#
# Then restart Zed (or reload the extension) so `language_server_command`'s
# `Worktree::which` can find it. If Zed still reports it "not found on `$PATH`",
# confirm `~/.cargo/bin` is on your `PATH` and that the binary is there.
[language_servers.lichen-language-server]
name = "Lichen Language Server"
languages = ["Lichen"]

# Map Zed's "Lichen" language to the LSP `languageId` our server receives in
# `textDocument/didOpen`.
[language_servers.lichen-language-server.language_ids]
"Lichen" = "lichen"

# Tree-sitter grammar for syntax highlighting, living in THIS repository as the
# `tree-sitter-lichen/` sub-directory.  The optional `path` field (seen here) is
# what lets Zed build a grammar from a sub-directory of a (mono)repo; it is
# interpreted relative to the root of the grammar repository.
#
# `rev` must be a real Git SHA in `lichen-vm` — set it to the commit that
# contains the `tree-sitter-lichen/` directory, then `tree-sitter generate` was
# already run so `src/parser.c` is committed.  `0773b18` is the grammar update
# that added the `return` keyword (and regenerated `src/parser.c`); the earlier
# `9b23892` rev predates `return`, which made the extension's `highlights.scm`
# fail on load with `Query error ... Invalid node type "return"`.
#
# NOTE: this grammar is committed and pushed to `origin/v1`, so both the remote
# and the local `file://` form work.  The `file://` URL is kept for local
# development so Zed clones the local repo and checks out `rev` from it:
#
#   [grammars.lichen]
#   repository = "https://github.com/windwhiterain/lichen-vm"
#   rev = "0773b1862cf4397a8004909bd980d2dd2cdc5013"
#   path = "tree-sitter-lichen"
[grammars.lichen]
repository = "file:///C:/resource/lichen-vm"
rev = "0773b1862cf4397a8004909bd980d2dd2cdc5013"
path = "tree-sitter-lichen"
