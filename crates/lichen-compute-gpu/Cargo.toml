[package]
name = "lichen-compute-gpu"
version.workspace = true
edition.workspace = true

# A second backend for the lowered-kernel IR, and deliberately a crate of its
# own: it depends on `lichen-kernel-ir` (the IR), on `lichen-runtime` (the
# artifact and the device facts) and on a GPU runtime, and nothing that merely
# wants the IR has to take either.  `lichen-compute` — the wasm backend — does
# not depend on this crate, so a build that never dispatches a kernel to a
# device never links a GPU loader.
#
# This crate is not a workspace dependency of anything else in the workspace.  It
# is a member so `cargo test --workspace` exercises it, which means the GPU
# tests need a device.  Where there is no adapter carrying `shaderInt64` they do
# not fail: each one returns early and writes the reason it skipped to stderr,
# which libtest captures for a passing test, so `--nocapture` is how the skip is
# read.  The emitter's tests need no device, except that the one shelling out to
# `spirv-val` skips on the same terms when the tool is not on `PATH`.
[dependencies]
ash = "0.38.0"
lichen-kernel-ir.workspace = true
# The artifact loader and the `DeviceFactsSource` trait it declares: a Vulkan context
# answers what the device **is**, which is a runtime fact and not part of the backend
# contract. The edge is deliberately one way — the runtime names no backend — and
# `default-features = false` drops the runtime's `wasm` feature, because nothing in
# this crate reads the emitted-module cache or the engine behind it. The path is
# stated here rather than inherited because cargo refuses `default-features = false`
# on an inherited `workspace.dependencies` entry.
lichen-runtime = { path = "../lichen-runtime", default-features = false }

# The graph IR, so a graph can be run against a real device. A **dev**
# dependency on purpose: this crate is a backend and takes no part in building
# graphs, and the dependency is here so the tests can prove the two fit rather
# than so the backend can see a graph.
[dev-dependencies]
lichen-graph-ir = { path = "../lichen-graph-ir" }
# The acceptance case's bodies: a declared reduction tiled across the workgroup, checked against
# the emitter here and run on a device from `lichen-language`'s own tests.
lichen-fusion = { path = "../lichen-fusion" }
lichen-fusion-bridge = { path = "../lichen-fusion-bridge" }
