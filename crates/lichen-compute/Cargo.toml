[package]
name = "lichen-compute"
version.workspace = true
edition.workspace = true

[dependencies]
# The wasm-tools release of `wasmi` 2.0.0's validator (`wasmparser` 0.228):
# `wasmi::Module::new` validates every assembled module before it runs, so the
# encoder must not be a newer generation than the parser that checks its output.
wasm-encoder = "0.248.0"
lichen-kernel-ir.workspace = true
# The recording builds real graph IR nodes, so this is the crate that owns the
# value table, the edge rules and the named refusals — not a parallel copy of
# them. It depends on `lichen-kernel-ir` alone, so this edge adds nothing to the
# graph-ir side and keeps `lichen-compute` free of any device dependency.
lichen-graph-ir.workspace = true
# The runtime the artifact half lives in, re-exported from the paths that named it
# before the move. `lichen-compute` is what plugs the runtime into the language:
# everything that still takes a `Module` is here, and everything that takes only
# IR types is there.
lichen-runtime.workspace = true
lichen-highlevel.workspace = true
lichen-lowlevel.workspace = true
lichen-utils.workspace = true
# The sub-language in `language.rs`: the bare language this plugin composes over,
# plus the two compiler plugins whose attributes its vocabulary carries.
lichen-language.workspace = true
lichen-doc.workspace = true
lichen-perspective.workspace = true
waffle = { version = "0.3.2", default-features = false }
# Stated in the workspace because the runtime's emitted-module cache holds one of
# these per kernel; the version note that matters is the one on the encoder above.
wasmi.workspace = true
# The symbolic core and its bridge: a region's schema is an expression tree, and
# the tests state one by hand. The library reads the derivation through
# `lichen-runtime`, which is where it now is; these are the same crates the
# runtime reads, so the edge costs nothing to link.
lichen-fusion.workspace = true
lichen-fusion-bridge.workspace = true
# The device backend and the README generator, both optional: the examples that
# dispatch a kernel to a device need them and nothing in the library does, so a
# build that never dispatches never links a GPU loader and never reads the
# example programs. The `device` feature turns them on for those examples alone.
lichen-compute-gpu = { workspace = true, optional = true }

[features]
device = ["lichen-compute-gpu"]

[[example]]
name = "algorithms"
required-features = ["device"]

[[example]]
name = "bench"
required-features = ["device"]

[[example]]
name = "cache_pipeline"
required-features = ["device"]

[[example]]
name = "crossbackend"
required-features = ["device"]

[[example]]
name = "graph_leg_probe"
required-features = ["device"]

[[example]]
name = "histogram_atomic_gpu"
required-features = ["device"]

[[example]]
name = "math_operators"
required-features = ["device"]

[[example]]
name = "recursion"
required-features = ["device"]
