[package]
name = "lichen-compute"
version.workspace = true
edition.workspace = true

[dependencies]
wasmi = "2.0.0"
# `emit_node` is the one recursive walk on the kernel lowering path that nothing
# else grows the stack for, so it is `#[stacksafe]` and depth-budgeted
# (`MAX_KERNEL_BODY_DEPTH` in `compute.rs`).
stacksafe.workspace = true
# The wasm-tools release of `wasmi` 2.0.0's validator (`wasmparser` 0.228):
# `wasmi::Module::new` validates every assembled module before it runs, so the
# encoder must not be a newer generation than the parser that checks its output.
wasm-encoder = "0.248.0"
lichen-kernel-ir.workspace = true
# The recording builds real graph IR nodes, so this is the crate that owns the
# value table, the edge rules and the named refusals — not a parallel copy of
# them. It depends on `lichen-kernel-ir` alone, so this edge adds nothing to the
# graph-ir side and keeps `lichen-compute` free of any device dependency.
lichen-graph-ir.workspace = true
lichen-highlevel.workspace = true
lichen-lowlevel.workspace = true
lichen-utils.workspace = true
# The sub-language in `language.rs`: the bare language this plugin composes over,
# plus the two compiler plugins whose attributes its vocabulary carries.
lichen-language.workspace = true
lichen-doc.workspace = true
lichen-perspective.workspace = true
waffle = { version = "0.3.2", default-features = false }
# The fused-kernel artifact is text a human edits, so the schema derives
# `Facet` and the text is JSON rather than a hand-written codec.
facet.workspace = true
# The reader, which refuses a hand-edited text with the field and the byte
# offset it failed at rather than a message saying only that it failed.
facet-json.workspace = true
# The symbolic core and its bridge: a schema's projections are `lichen_fusion::Expr`,
# so deriving one is library work and not an example's. See docs/notes/graph-fusion.md §4.
lichen-fusion.workspace = true
lichen-fusion-bridge.workspace = true

[dev-dependencies]
# The seam test: a real lichen program dispatching to a real device. This crate
# depends on the GPU backend only for its tests, so no library half of it — and
# no host that composes the sub-language — links a GPU loader.
lichen-compute-gpu.workspace = true
# `tests/readme.rs` and `tests/examples.rs` drive the README tooling, which
# lives in its own crate; a dev-dependency keeps them here without putting the
# generator in the library.
lichen-tools.workspace = true
