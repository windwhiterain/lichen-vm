[package]
name = "lichen-package"
version = "0.1.0"
edition = "2024"
default-run = "lichen"
description = "The lichen package manager: resolve git dependencies, fetch the toolchain binaries, and own the preprocessor import path."

[lib]
name = "lichen_package"
path = "src/lib.rs"

[[bin]]
name = "lichen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lichen-preprocess = { path = "../lichen-preprocess" }
lichen-registry = { path = "../lichen-registry" }
lichen-utils = { path = "../lichen-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The generated-manifest test parses the document it emits, so the escaping is
# checked by a real TOML parser rather than by string comparison.
[dev-dependencies]
toml = "0.8"
