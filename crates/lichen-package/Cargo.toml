[package]
name = "lichen-package"
version.workspace = true
edition.workspace = true
default-run = "lichen"
description = "The lichen package manager: resolve git dependencies, fetch the toolchain binaries, and own the preprocessor import path."

[lib]
name = "lichen_package"
path = "src/lib.rs"

[[bin]]
name = "lichen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
lichen-preprocess.workspace = true
lichen-registry.workspace = true
lichen-utils.workspace = true
serde.workspace = true
serde_json.workspace = true

# The generated-manifest test parses the document it emits, so the escaping is
# checked by a real TOML parser rather than by string comparison.
[dev-dependencies]
toml = "0.8"
