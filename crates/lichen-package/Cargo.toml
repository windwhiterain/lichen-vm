[package]
name = "lichen-package"
version = "0.1.0"
edition = "2024"
default-run = "lichen"
description = "The lichen package manager: resolve git dependencies, fetch the toolchain binaries, and own the preprocessor import path."

[lib]
name = "lichen_package"
path = "src/lib.rs"

[[bin]]
name = "lichen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
lichen-language = { path = "../lichen-language" }
