[package]
name = "tree-sitter-lichen"
version = "0.1.0"
description = "A Tree-sitter grammar for the Lichen language"
license = "MIT OR Apache-2.0"
edition = "2021"
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[build-dependencies]
cc = "1.0"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25"

# This crate is NOT a workspace member, so `cargo test --workspace` never builds it and
# its tests can never block the default run. Testing it is always explicit — invoke it via
# its own manifest — so the samples test runs by default:
#   cargo test --manifest-path tree-sitter-lichen/Cargo.toml
# (the only opt-in gate is `grammar-consistency` in `lichen-language-zed`, which does pull
# this crate in as a dep and needs the tree-sitter CLI).
#
# The empty table below is deliberate: it stops cargo's upward search for a workspace root
# at this manifest. Without it, resolving this manifest from a nested worktree reaches the
# main checkout's manifest — which does not `exclude` this path — and cargo rejects the
# crate as believing it is in a workspace when it is not.

[workspace]
