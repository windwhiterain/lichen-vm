[package]
name = "tree-sitter-lichen"
version = "0.1.0"
description = "A Tree-sitter grammar for the Lichen language"
license = "MIT OR Apache-2.0"
edition = "2021"
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[build-dependencies]
cc = "1.0"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25"
